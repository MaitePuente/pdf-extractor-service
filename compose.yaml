name: pdf-extractor

services:
  extractor:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: "true"
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CACHE_TIMEOUT_SECONDS: ${CACHE_TIMEOUT_SECONDS:-0.2}
      QUEUE_SIZE: ${QUEUE_SIZE:-16}
      MAX_IN_FLIGHT: ${MAX_IN_FLIGHT:-4}
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-1}
      ADMISSION_TIMEOUT_SECONDS: ${ADMISSION_TIMEOUT_SECONDS:-2}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      READINESS_REDIS_REQUIRED: ${READINESS_REDIS_REQUIRED:-false}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-0.1}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-0.05}
      GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS: ${GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS:-30}
    cpus: 1.0
    mem_limit: 768m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 35s
    ports:
      # Docker assigns a free local port per instance; no fixed-port conflict.
      - "127.0.0.1::8000"
    networks:
      - pdf-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  redis:
    image: redis:8.2.10-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    cpus: 0.5
    mem_limit: 256m
    networks:
      - pdf-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  pdf-network:
    external: true
    name: pdf-network
