[project]
name = "pdf-extractor-service"
version = "0.1.0"
description = "Independent, in-memory PDF to Markdown API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.3",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-sdk==1.45.2",
    "prometheus-client>=0.21,<1",
    "pydantic==2.14.3",
    "pymupdf==2.1",
    "redis==8.1.0",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pymupdf4llm==2.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--confcutdir=tests --import-mode=importlib"
markers = ["integration: requires the extractor Docker Compose stack and real Redis"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/performance/check_content.py" = ["E731"]
"tests/performance/offline.py" = ["E731"]
"tests/performance/profile_cold.py" = ["F401"]
"tests/performance/run_official_spike.py" = ["E402"]
"tests/performance/vegeta/run.py" = ["E402"]
"tests/test_admission.py" = ["F401"]
