[project]
name = "pdf-extractor-service"
version = "0.1.0"
description = "Independent, in-memory PDF to Markdown API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pymupdf>=1.27.2.2,<2",
    "pymupdf4llm>=1.0,<2",
    "redis>=7,<9",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--confcutdir=tests --import-mode=importlib"
markers = ["integration: requires the extractor Docker Compose stack and real Redis"]
